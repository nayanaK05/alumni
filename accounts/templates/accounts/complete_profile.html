<!DOCTYPE html>
<html>
<head>
    <title>Complete Profile</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            min-height:100vh;
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            padding:40px;
            border-radius:20px;
            width:450px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#1f4037;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
            border-radius:10px;
            border:1px solid #ccc;
        }

        .btn{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:25px;
            background:#1f4037;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .btn:hover{
            background:#16332c;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Complete Your Profile</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="full_name" placeholder="Full Name" required>
        <input type="text" name="department" placeholder="Department" required>
        <input type="number" name="passout_year" placeholder="Passout Year" required>
        <input type="text" name="register_number" placeholder="Register Number" required>
        <input type="text" name="phone" placeholder="Phone Number" required>
        <input type="text" name="current_job" placeholder="Current Job">
        <input type="text" name="company" placeholder="Company">

        <button type="submit">Submit Profile</button>
    </form>

</div>

</body>
</html>
