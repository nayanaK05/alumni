<!DOCTYPE html>
<html>
<head>
    <title>Alumni Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .navbar {
            text-align: center;
            padding: 18px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .feed {
            padding: 20px;
            margin-bottom: 80px;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .dp {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            margin-right: 12px;
        }

        .username {
            font-weight: 600;
            font-size: 16px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
        }

        .bottom-nav a {
            text-decoration: none;
            color: white;
            font-size: 22px;
            transition: 0.2s;
        }

        .bottom-nav a:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

<div class="navbar">
    Alumni Network 🚀
</div>

<div class="feed">

    <div class="card">
        <div class="user-info">
            <img src="{{ request.user.alumniprofile.profile_pic.url }}" class="dp">
            <div class="username">{{ request.user.username }}</div>
        </div>
        <p>Welcome back! Connect with alumni and explore opportunities 🎓</p>
    </div>

    <div class="card">
        <div class="user-info">
            <img src="{{ request.user.alumniprofile.profile_pic.url }}" class="dp">
            <div class="username">Alumni Event</div>
        </div>
        <p>Annual Meet 2026 registrations are now open 🔥</p>
    </div>

</div>
<div class="profile-section">
    {% if user.alumniprofile.profile_pic %}
        <img src="{{ user.alumniprofile.profile_pic.url }}"
             width="120"
             height="120"
             style="border-radius:50%;">
    {% else %}
        <p>No Profile Picture</p>
    {% endif %}

    <h3>{{ user.username }}</h3>
</div>

<div class="bottom-nav">
    <a href="{% url 'dashboard' %}">🏠</a>
    <a href="{% url 'search' %}">🔍</a>
    <a href="{% url 'profile' %}">👤</a>
</div>

</body>
</html>
