<!DOCTYPE html>
<html>
<head>
    <title>Login | Alumni Portal</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            padding:40px;
            border-radius:20px;
            width:400px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#1f4037;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:30px;
            border:1px solid #ccc;
            outline:none;
        }

        .btn{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:30px;
            background:#1f4037;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .btn:hover{
            background:#16332c;
        }

        .register-link{
            text-align:center;
            margin-top:15px;
            font-size:14px;
        }

        .register-link a{
            color:#1f4037;
            text-decoration:none;
            font-weight:bold;
        }

        .error{
            color:red;
            text-align:center;
            margin-bottom:10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Login</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit" class="btn">Login</button>
    </form>

    <div class="register-link">
        Don't have an account? <a href="/register/">Register</a>
    </div>
</div>

</body>
</html>
